name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # Buat package.json
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kalkulator-gadai",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "typescript": "^5.8.3"
            }
          }
          EOF


      # Install dependency
      - name: Install dependencies
        run: npm install


      # Cek Java
      - name: Check Java
        run: |
          java -version


      # Cek TypeScript
      - name: Check TypeScript
        run: |
          npx tsc --version


      # Buat konfigurasi Capacitor
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.gadaioganbaru.kalkulator',
            appName: 'Kalkulator Gadai Ogan Baru',
            webDir: 'www'
          };

          export default config;
          EOF


      # Pastikan HTML ada
      - name: Check HTML
        run: |
          echo "Memeriksa file HTML..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html tidak ditemukan!"
            exit 1
          fi

          echo "www/index.html ditemukan."


      # Tambahkan Android
      - name: Add Android
        run: |
          npx cap add android


      # Copy HTML
      - name: Copy Web App
        run: |
          npx cap copy android


      # Sync
      - name: Sync Android
        run: |
          npx cap sync android


      # Permission Gradle
      - name: Grant Gradle permission
        run: |
          chmod +x android/gradlew


      # Build APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug


      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-gadai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
