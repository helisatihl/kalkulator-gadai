<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalkulator Gadai</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #fff7f1;
    font-family: Arial, sans-serif;
    color: #333;
}

.container {
    max-width: 550px;
    margin: auto;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #FFA259, #ffbd8a);
    color: white;
    padding: 24px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 15px rgba(255,162,89,0.25);
}

.header h1 {
    margin: 0 0 7px;
    font-size: 25px;
}

.header p {
    margin: 0;
    opacity: 0.95;
}

/* NAVIGASI */

.nav {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.nav button {
    flex: 1;
    background: white;
    color: #555;
    border: 1px solid #ddd;
    padding: 13px 8px;
    border-radius: 10px;
    font-size: 14px;
}

.nav button.active-perpanjang {
    background: #FFA259;
    color: white;
    border-color: #FFA259;
}

.nav button.active-tebus {
    background: #092328;
    color: white;
    border-color: #092328;
}

/* CARD */

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

/* FIELD */

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    outline: none;
}

input:focus,
select:focus {
    border-color: #FFA259;
    box-shadow: 0 0 0 3px rgba(255,162,89,0.15);
}

/* BUTTON */

button {
    cursor: pointer;
    font-weight: bold;
}

.btn-hitung {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #FFA259;
    color: white;
}

.btn-reset {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #f1f1f1;
    color: #444;
    margin-top: 9px;
}

/* TEBUS */

.btn-hitung-tebus {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #092328;
    color: white;
}

.btn-hitung-tebus:hover {
    background: #12363c;
}

/* HASIL */

.hasil {
    margin-top: 20px;
    padding: 17px;
    background: linear-gradient(135deg, #FFA259, #FFD0AD);
    border: 1px solid #FFA259;
    border-radius: 14px;
}

.hasil-tebus {
    background: #092328;
    border: 1px solid #092328;
    color: white;
}

.baris {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.45);
}

.total {
    margin-top: 5px;
    font-size: 20px;
    font-weight: bold;
}

.hasil-tebus .total {
    color: white;
}

/* STATUS */

.status {
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.5;
}

.status-aman {
    background: #eaf8ed;
    border: 1px solid #8bd39a;
    color: #256b32;
}

.status-warning {
    background: #fff8df;
    border: 1px solid #f0c85a;
    color: #765900;
}

.status-danger {
    background: #ffeaea;
    border: 1px solid #e58b8b;
    color: #8b2020;
}

/* SALIN */

.btn-salin {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #FFA259;
    color: white;
    margin-top: 14px;
}

.hasil-tebus .btn-salin {
    background: #092328;
    border: 1px solid rgba(255,255,255,0.4);
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 22px;
    padding: 14px;
    color: #9a6a4a;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;
}

.footer .version,
.footer .year {
    font-size: 12px;
    font-weight: 500;
}

/* HIDDEN */

.hidden {
    display: none;
}

/* RESPONSIVE */

@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .header {
        padding: 20px;
    }

    .header h1 {
        font-size: 22px;
    }

    .card {
        padding: 16px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

    <h1>Kalkulator Gadai</h1>

    <p>
        Perhitungan perpanjang & tebus gadai
    </p>

</div>


<!-- NAVIGASI -->

<div class="nav">

    <button
        id="navPerpanjang"
        class="active-perpanjang"
        onclick="tampilMenu('perpanjang')"
    >
        🔄 Perpanjang
    </button>

    <button
        id="navTebus"
        onclick="tampilMenu('tebus')"
    >
        🔓 Tebus Gadai
    </button>

</div>


<!-- ================================================= -->
<!-- MENU PERPANJANG -->
<!-- ================================================= -->

<div
    id="menuPerpanjang"
    class="card"
>

    <h2>Kalkulator Perpanjang</h2>

    <div class="field">

        <label>Nilai Gadai</label>

        <input
            type="number"
            id="nilaiGadai"
            min="0"
            placeholder="Contoh: 1000000"
        >

    </div>


    <div class="field">

        <label>
            Tanggal Jatuh Tempo Awal
        </label>

        <input
            type="date"
            id="tanggalJatuhTempo"
        >

    </div>


    <div class="field">

        <label>
            Tanggal Perpanjang
        </label>

        <input
            type="date"
            id="tanggalProses"
        >

    </div>


    <div class="field">

        <label>Pilih Bunga</label>

        <select id="bunga">

            <option value="5">
                5% / 15 Hari
            </option>

            <option value="10">
                10% / 30 Hari
            </option>

        </select>

    </div>


    <div class="field">

        <label>Sisa Denda</label>

        <input
            type="number"
            id="sisaDenda"
            min="0"
            placeholder="Isi jika ada"
        >

    </div>


    <button
        class="btn-hitung"
        onclick="hitungPerpanjang()"
    >
        HITUNG PERPANJANG
    </button>


    <button
        class="btn-reset"
        onclick="resetPerpanjang()"
    >
        RESET
    </button>


    <div
        id="hasilPerpanjang"
        class="hidden"
    ></div>

</div>


<!-- ================================================= -->
<!-- MENU TEBUS -->
<!-- ================================================= -->

<div
    id="menuTebus"
    class="card hidden"
>

    <h2 style="color:#092328;">
        Kalkulator Tebus Gadai
    </h2>


    <div class="field">

        <label>
            Nilai Gadai / Pokok Pinjaman
        </label>

        <input
            type="number"
            id="nilaiTebus"
            min="0"
            placeholder="Contoh: 1000000"
        >

    </div>


    <div class="field">

        <label>
            Tanggal Jatuh Tempo
        </label>

        <input
            type="date"
            id="tempoTebus"
        >

    </div>


    <div class="field">

        <label>
            Tanggal Tebus
        </label>

        <input
            type="date"
            id="tanggalTebus"
        >

    </div>


    <div class="field">

        <label>
            Pilih Bunga
        </label>

        <select id="bungaTebus">

            <option value="5">
                5% / 15 Hari
            </option>

            <option value="10">
                10% / 30 Hari
            </option>

        </select>

    </div>


    <button
        class="btn-hitung-tebus"
        onclick="hitungTebus()"
    >
        HITUNG TEBUS
    </button>


    <button
        class="btn-reset"
        onclick="resetTebus()"
    >
        RESET
    </button>


    <div
        id="hasilTebus"
        class="hidden"
    ></div>

</div>


<!-- FOOTER -->

<footer class="footer">

    <div>
        Helisati Putra Hulu, S.Kom
    </div>

    <div class="version">
        Version 1.0
    </div>

    <div class="year">
        2026
    </div>

</footer>

</div>


<script>

/* =====================================================
   VARIABEL
===================================================== */

let teksPerpanjang = "";
let teksTebus = "";


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(angka) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(angka);

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function tanggalIndo(tanggal) {

    return new Date(
        tanggal + "T00:00:00"
    ).toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   SELISIH HARI
===================================================== */

function selisihHari(awal, akhir) {

    const a =
        new Date(
            awal + "T00:00:00"
        );

    const b =
        new Date(
            akhir + "T00:00:00"
        );

    return Math.round(
        (
            b.getTime() -
            a.getTime()
        ) / 86400000
    );

}


/* =====================================================
   TAMBAH HARI
===================================================== */

function tambahHari(tanggal, jumlah) {

    const d =
        new Date(
            tanggal + "T00:00:00"
        );

    d.setDate(
        d.getDate() + jumlah
    );

    const tahun =
        d.getFullYear();

    const bulan =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const hari =
        String(
            d.getDate()
        ).padStart(2, "0");

    return `${tahun}-${bulan}-${hari}`;

}


/* =====================================================
   NAVIGASI
===================================================== */

function tampilMenu(menu) {

    const perpanjang =
        document.getElementById(
            "menuPerpanjang"
        );

    const tebus =
        document.getElementById(
            "menuTebus"
        );

    const navPerpanjang =
        document.getElementById(
            "navPerpanjang"
        );

    const navTebus =
        document.getElementById(
            "navTebus"
        );


    if (menu === "perpanjang") {

        perpanjang.classList.remove(
            "hidden"
        );

        tebus.classList.add(
            "hidden"
        );

        navPerpanjang.className =
            "active-perpanjang";

        navTebus.className = "";

    }

    else {

        perpanjang.classList.add(
            "hidden"
        );

        tebus.classList.remove(
            "hidden"
        );

        navPerpanjang.className = "";

        navTebus.className =
            "active-tebus";

    }

}


/* =====================================================
   PERPANJANG
===================================================== */

function hitungPerpanjang() {

    const nilai =
        Number(
            document.getElementById(
                "nilaiGadai"
            ).value
        );

    const tempo =
        document.getElementById(
            "tanggalJatuhTempo"
        ).value;

    const proses =
        document.getElementById(
            "tanggalProses"
        ).value;

    const persen =
        Number(
            document.getElementById(
                "bunga"
            ).value
        );

    const sisa =
        Number(
            document.getElementById(
                "sisaDenda"
            ).value
        ) || 0;


    if (
        !nilai ||
        !tempo ||
        !proses
    ) {

        alert(
            "Mohon lengkapi data perpanjang."
        );

        return;

    }


    const periode =
        persen === 5
            ? 15
            : 30;


    const bungaSatu =
        nilai *
        persen /
        100;


    const tempoAkhir =
        tambahHari(
            tempo,
            periode
        );


    const mulai2x =
        tambahHari(
            tempoAkhir,
            -3
        );


    let jumlahBunga;


    if (
        proses < mulai2x
    ) {

        jumlahBunga = 1;

    }

    else {

        const lewat =
            selisihHari(
                tempoAkhir,
                proses
            );

        if (
            lewat < 0
        ) {

            jumlahBunga = 2;

        }

        else {

            jumlahBunga =
                Math.floor(
                    lewat / periode
                ) + 2;

        }

    }


    const totalBunga =
        bungaSatu *
        jumlahBunga;


    let keterlambatan =
        selisihHari(
            tempo,
            proses
        );


    if (
        keterlambatan < 0
    ) {

        keterlambatan = 0;

    }


    const denda =
        keterlambatan *
        10000;


    const total =
        totalBunga +
        denda +
        sisa;


    const tempoBaru =
        tambahHari(
            tempo,
            periode *
            jumlahBunga
        );


    teksPerpanjang =

`*PT. GADAI OGAN BARU*
*OUTLET 07 MARELAN*

BANK BNI
No. Rek : 1978693109
A/N GADAI OGAN BARU

Bunga : ${rupiah(totalBunga)} (${jumlahBunga}x bunga ${persen}%)
Denda : ${rupiah(denda)}${keterlambatan > 0 ? ` (${keterlambatan} hari lewat)` : ""}
${sisa > 0 ? `Sisa Denda : ${rupiah(sisa)}\n` : ""}
*Total  : ${rupiah(total)}*

Kalau sudah di transfer jangan lupa dikirim bukti pembayarannya dan nama akun pengirimnya yah Pak/Bu
terimakasih 🙏😇`;


    const hasil =
        document.getElementById(
            "hasilPerpanjang"
        );

    hasil.className =
        "hasil";


    hasil.innerHTML = `

        <div class="baris">
            <span>Nilai Gadai</span>
            <strong>${rupiah(nilai)}</strong>
        </div>

        <div class="baris">
            <span>Jatuh Tempo Awal</span>
            <strong>${tanggalIndo(tempo)}</strong>
        </div>

        <div class="baris">
            <span>Tanggal Perpanjang</span>
            <strong>${tanggalIndo(proses)}</strong>
        </div>

        <div class="baris">
            <span>Bunga</span>
            <strong>${jumlahBunga}x ${persen}%</strong>
        </div>

        <div class="baris">
            <span>Jatuh Tempo Akhir</span>
            <strong>${tanggalIndo(tempoBaru)}</strong>
        </div>

        <div class="baris">
            <span>Total Bunga</span>
            <strong>${rupiah(totalBunga)}</strong>
        </div>

        <div class="baris">
            <span>Denda</span>
            <strong>${rupiah(denda)}</strong>
        </div>

        <div class="baris">
            <span>Sisa Denda</span>
            <strong>${rupiah(sisa)}</strong>
        </div>

        <div class="baris total">
            <span>TOTAL</span>
            <strong>${rupiah(total)}</strong>
        </div>

        <button
            class="btn-salin"
            onclick="salinPerpanjang()"
        >
            📋 SALIN RINCIAN
        </button>

    `;

}


/* =====================================================
   TEBUS GADAI
===================================================== */

function hitungTebus() {

    const pokok =
        Number(
            document.getElementById(
                "nilaiTebus"
            ).value
        );

    const tempo =
        document.getElementById(
            "tempoTebus"
        ).value;

    const tebus =
        document.getElementById(
            "tanggalTebus"
        ).value;

    const persen =
        Number(
            document.getElementById(
                "bungaTebus"
            ).value
        );


    if (
        !pokok ||
        !tempo ||
        !tebus
    ) {

        alert(
            "Mohon lengkapi data tebus."
        );

        return;

    }


    /* ==============================================
       HARI LEWAT
    ============================================== */

    let hariLewat =
        selisihHari(
            tempo,
            tebus
        );


    if (
        hariLewat < 0
    ) {

        hariLewat = 0;

    }


    /* ==============================================
       DENDA
       Rp10.000 / HARI
    ============================================== */

    const denda =
        hariLewat *
        10000;


    /* ==============================================
       JUMLAH BUNGA
    ============================================== */

    let jumlahBunga = 0;


    /*
    ==============================================
    BUNGA 5%
    ==============================================

    0 - 10   = 0x
    11 - 15  = 1x
    16 - 30  = 2x
    31 - 41  = 3x
    42 - 46  = 4x
    47 - 61  = 5x
    62 - 76  = 6x
    dst.
    */

    if (
        persen === 5
    ) {

        if (
            hariLewat <= 10
        ) {

            jumlahBunga = 0;

        }

        else if (
            hariLewat <= 15
        ) {

            jumlahBunga = 1;

        }

        else if (
            hariLewat <= 30
        ) {

            jumlahBunga = 2;

        }

        else if (
            hariLewat <= 41
        ) {

            jumlahBunga = 3;

        }

        else if (
            hariLewat <= 46
        ) {

            jumlahBunga = 4;

        }

        else {

            jumlahBunga =
                5 +
                Math.floor(
                    (hariLewat - 47) / 15
                );

        }

    }


    /*
    ==============================================
    BUNGA 10%
    ==============================================

    0 - 15   = 0x
    16 - 30  = 1x
    31 - 45  = 2x
    46 - 60  = 3x
    61 - 75  = 4x
    76 - 90  = 5x
    dst.
    */

    else {

        if (
            hariLewat <= 15
        ) {

            jumlahBunga = 0;

        }

        else {

            jumlahBunga =
                1 +
                Math.floor(
                    (hariLewat - 16) / 15
                );

        }

    }


    /* ==============================================
       HITUNG BUNGA
    ============================================== */

    const bungaSatu =
        pokok *
        persen /
        100;


    const bungaKeterlambatan =
        bungaSatu *
        jumlahBunga;


    /* ==============================================
       TOTAL TEBUS
    ============================================== */

    const total =
        pokok +
        bungaKeterlambatan +
        denda;


    /* ==============================================
       TEKS SALINAN
    ============================================== */

    teksTebus =

`*PT. Gadai Ogan Baru*

Tanggal Tebus : ${tanggalIndo(tebus)}
Nilai Gadai : ${rupiah(pokok)}
Bunga Keterlambatan : ${rupiah(bungaKeterlambatan)}
Denda : ${rupiah(denda)}${hariLewat > 0 ? ` (${hariLewat} hari lewat)` : ""}
*TOTAL TEBUS : ${rupiah(total)}*`;


    /* ==============================================
       KETERANGAN
    ============================================== */

    let keterangan;


    if (
        hariLewat === 0
    ) {

        keterangan =
            "Ditebus sebelum atau tepat tanggal jatuh tempo.";

    }

    else {

        keterangan =
            `Terlambat ${hariLewat} hari. Dikenakan ${jumlahBunga}x bunga ${persen}% dan denda Rp10.000/hari.`;

    }


    /* ==============================================
       TAMPILKAN HASIL
    ============================================== */

    const hasil =
        document.getElementById(
            "hasilTebus"
        );

    hasil.className =
        "hasil hasil-tebus";


    hasil.innerHTML = `

        <div class="baris">

            <span>
                Nilai Gadai
            </span>

            <strong>
                ${rupiah(pokok)}
            </strong>

        </div>


        <div class="baris">

            <span>
                Jatuh Tempo
            </span>

            <strong>
                ${tanggalIndo(tempo)}
            </strong>

        </div>


        <div class="baris">

            <span>
                Tanggal Tebus
            </span>

            <strong>
                ${tanggalIndo(tebus)}
            </strong>

        </div>


        <div class="baris">

            <span>
                Hari Lewat
            </span>

            <strong>
                ${hariLewat} Hari
            </strong>

        </div>


        <div class="baris">

            <span>
                Bunga Keterlambatan
            </span>

            <strong>
                ${rupiah(bungaKeterlambatan)}
                (${jumlahBunga}x bunga)
            </strong>

        </div>


        <div class="baris">

            <span>
                Denda
            </span>

            <strong>
                ${rupiah(denda)}
            </strong>

        </div>


        <div class="baris total">

            <span>
                TOTAL TEBUS
            </span>

            <strong>
                ${rupiah(total)}
            </strong>

        </div>


        <div class="status ${
            hariLewat === 0
                ? "status-aman"
                : "status-warning"
        }">

            ${keterangan}

        </div>


        <button
            class="btn-salin"
            onclick="salinTebus()"
        >

            📋 SALIN RINCIAN TEBUS

        </button>

    `;

}


/* =====================================================
   SALIN PERPANJANG
===================================================== */

function salinPerpanjang() {

    if (
        !teksPerpanjang
    ) {

        alert(
            "Hitung terlebih dahulu."
        );

        return;

    }

    salinTeks(
        teksPerpanjang
    );

}


/* =====================================================
   SALIN TEBUS
===================================================== */

function salinTebus() {

    if (
        !teksTebus
    ) {

        alert(
            "Hitung terlebih dahulu."
        );

        return;

    }

    salinTeks(
        teksTebus
    );

}


/* =====================================================
   FUNGSI SALIN
===================================================== */

function salinTeks(teks) {

    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(teks)

            .then(function() {

                alert(
                    "Rincian berhasil disalin. Silakan paste ke WhatsApp."
                );

            })

            .catch(function() {

                fallbackCopy(teks);

            });

    }

    else {

        fallbackCopy(teks);

    }

}


function fallbackCopy(teks) {

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value =
        teks;

    document.body.appendChild(
        textarea
    );

    textarea.select();

    document.execCommand(
        "copy"
    );

    document.body.removeChild(
        textarea
    );

    alert(
        "Rincian berhasil disalin."
    );

}


/* =====================================================
   RESET PERPANJANG
===================================================== */

function resetPerpanjang() {

    document.getElementById(
        "nilaiGadai"
    ).value = "";

    document.getElementById(
        "tanggalJatuhTempo"
    ).value = "";

    setTanggalHariIni(
        "tanggalProses"
    );

    document.getElementById(
        "bunga"
    ).value = "5";

    document.getElementById(
        "sisaDenda"
    ).value = "";

    document.getElementById(
        "hasilPerpanjang"
    ).className =
        "hidden";

    document.getElementById(
        "hasilPerpanjang"
    ).innerHTML = "";

    teksPerpanjang = "";

}

/* =====================================================
   TANGGAL HARI INI
===================================================== */

function setTanggalHariIni(id) {

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(2, "0");

    const hari =
        String(
            sekarang.getDate()
        ).padStart(2, "0");

    document.getElementById(id).value =
        `${tahun}-${bulan}-${hari}`;

}


/* =====================================================
   DEFAULT
===================================================== */

setTanggalHariIni(
    "tanggalProses"
);

setTanggalHariIni(
    "tanggalTebus"
);
