<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="128x128" href="/kalkulator-gadai/favicon-128x128.png">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="theme-color" content="#ffffff">

<title>Kalkulator Gadai</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #fff7f1;
    font-family: Arial, sans-serif;
    color: #333;
}

.container {
    max-width: 550px;
    margin: auto;
}

/* ================= HEADER ================= */

.header {
    background: linear-gradient(135deg, #FFA259, #ffbd8a);
    color: white;
    padding: 24px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 15px rgba(255,162,89,0.25);
}

.header h1 {
    margin: 0 0 7px;
    font-size: 25px;
}

.header p {
    margin: 0;
    opacity: 0.95;
}

/* ================= NAVIGASI ================= */

.nav {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.nav button {
    flex: 1;
    padding: 13px 6px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: white;
    color: #555;
    font-size: 13px;
}

.nav .active-perpanjang {
    background: #FFA259;
    color: white;
    border-color: #FFA259;
}

.nav .active-tebus {
    background: #092328;
    color: white;
    border-color: #092328;
}

.nav .active-followup {
    background: #249D8F;
    color: white;
    border-color: #249D8F;
}

/* ================= CARD ================= */

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

/* ================= FIELD ================= */

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #FFA259;
    box-shadow: 0 0 0 3px rgba(255,162,89,0.15);
}

#menuFollowUp input:focus,
#menuFollowUp select:focus {
    border-color: #249D8F;
    box-shadow: 0 0 0 3px rgba(36,157,143,0.15);
}

/* ================= BUTTON ================= */

button {
    cursor: pointer;
    font-weight: bold;
}

.btn-hitung {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #FFA259;
    color: white;
}

.btn-reset {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #f1f1f1;
    color: #444;
    margin-top: 9px;
}

/* ================= TEBUS BUTTON ================= */

.btn-hitung-tebus {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #092328;
    color: white;
}

/* ================= FOLLOW UP BUTTON ================= */

.btn-buat-followup {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #249D8F;
    color: white;
    transition: 0.2s;
}

.btn-buat-followup:active {
    transform: scale(0.98);
}

/* ================= FOLLOW UP ACTION ================= */

.followup-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.followup-actions button {
    width: 100%;
    min-height: 48px;
    padding: 10px 6px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.2;
    transition: 0.2s;
}

.followup-actions button:active {
    transform: scale(0.97);
}

.btn-wa {
    background: #249D8F;
    color: white;
}

.btn-call {
    background: #249D8F;
    color: white;
}

.btn-copy-followup {
    background: #249D8F;
    color: white;
}

/* ================= HASIL ================= */

.hasil {
    margin-top: 20px;
    padding: 17px;
    background: linear-gradient(135deg, #FFA259, #FFD0AD);
    border: 1px solid #FFA259;
    border-radius: 14px;
}

.hasil-tebus {
    background: #092328;
    border-color: #092328;
    color: white;
}

.hasil-followup {
    margin-top: 20px;
    padding: 17px;
    background: #f4fbfa;
    border: 1px solid #249D8F;
    border-radius: 14px;
}

/* ================= FOLLOW UP STATUS ================= */

.followup-status {
    padding: 15px;
    border-radius: 10px;
    background: #249D8F;
    color: white;
    margin-bottom: 15px;
    font-weight: bold;
    text-align: center;
}

/* ================= FOLLOW UP TEXTAREA ================= */

#pesanFollowUp {
    border-color: #249D8F !important;
}

#pesanFollowUp:focus {
    outline: none;
    border-color: #249D8F !important;
    box-shadow: 0 0 0 3px rgba(36,157,143,0.15);
}

/* ================= KETERANGAN ================= */

.status {
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.5;
}

.status-aman {
    background: #eaf8ed;
    border: 1px solid #8bd39a;
    color: #256b32;
}

.status-warning {
    background: #fff8df;
    border: 1px solid #f0c85a;
    color: #765900;
}

.status-danger {
    background: #ffe9e9;
    border: 1px solid #ef9999;
    color: #8b2020;
}

/* ================= SALIN ================= */

.btn-salin {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #FFA259;
    color: white;
    margin-top: 14px;
}

.hasil-tebus .btn-salin {
    background: #092328;
    border: 1px solid rgba(255,255,255,0.4);
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    margin-top: 22px;
    padding: 14px 10px;
    color: #9a6a4a;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;
}

.footer .version,
.footer .year {
    font-size: 12px;
    font-weight: 500;
}

/* ================= HIDDEN ================= */

.hidden {
    display: none;
}

/* ================= MOBILE ================= */

@media (max-width:480px) {

    body {
        padding: 12px;
    }

    .header {
        padding: 20px;
    }

    .header h1 {
        font-size: 22px;
    }

    .card {
        padding: 16px;
    }

    .nav button {
        font-size: 12px;
        padding: 12px 4px;
    }

    .followup-actions {
        gap: 6px;
    }

    .followup-actions button {
        font-size: 11px;
        padding: 9px 3px;
        min-height: 50px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>Kalkulator Gadai</h1>

    <p>
        Perhitungan gadai, perpanjang, tebus & follow up
    </p>

</div>

<div class="nav">

    <button
        id="navPerpanjang"
        class="active-perpanjang"
        onclick="tampilMenu('perpanjang')">
        🔄 Perpanjang
    </button>

    <button
        id="navTebus"
        onclick="tampilMenu('tebus')">
        🔓 Tebus Gadai
    </button>

    <button
        id="navFollowUp"
        onclick="tampilMenu('followup')">
        📱 Follow Up
    </button>

</div>


<!-- =====================================================
     PERPANJANG
===================================================== -->

<div id="menuPerpanjang" class="card">

    <h2>Kalkulator Perpanjang</h2>

    <div class="field">
        <label>Nilai Gadai</label>
        <input
            type="number"
            id="nilaiGadai"
            min="0"
            placeholder="Contoh: 1000000">
    </div>

    <div class="field">
        <label>Tanggal Jatuh Tempo Awal</label>
        <input
            type="date"
            id="tanggalJatuhTempo">
    </div>

    <div class="field">
        <label>Tanggal Perpanjang</label>
        <input
            type="date"
            id="tanggalProses">
    </div>

    <div class="field">
        <label>Pilih Bunga</label>

        <select id="bunga">
            <option value="5">5% / 15 Hari</option>
            <option value="10">10% / 30 Hari</option>
        </select>
    </div>

    <div class="field">
        <label>Sisa Denda</label>
        <input
            type="number"
            id="sisaDenda"
            min="0"
            placeholder="Isi jika ada">
    </div>

    <button
        class="btn-hitung"
        onclick="hitungPerpanjang()">
        HITUNG PERPANJANG
    </button>

    <button
        class="btn-reset"
        onclick="resetPerpanjang()">
        RESET
    </button>

    <div
        id="hasilPerpanjang"
        class="hidden">
    </div>

</div>


<!-- =====================================================
     TEBUS
===================================================== -->

<div id="menuTebus" class="card hidden">

    <h2 style="color:#092328;">
        Kalkulator Tebus Gadai
    </h2>

    <div class="field">
        <label>
            Nilai Gadai / Pokok Pinjaman
        </label>

        <input
            type="number"
            id="nilaiTebus"
            min="0"
            placeholder="Contoh: 1000000">
    </div>

    <div class="field">
        <label>Tanggal Jatuh Tempo</label>

        <input
            type="date"
            id="tempoTebus">
    </div>

    <div class="field">
        <label>Tanggal Tebus</label>

        <input
            type="date"
            id="tanggalTebus">
    </div>

    <div class="field">
        <label>Pilih Bunga</label>

        <select id="bungaTebus">
            <option value="5">5% / 15 Hari</option>
            <option value="10">10% / 30 Hari</option>
        </select>
    </div>

    <div class="field">
        <label>Sisa Denda</label>

        <input
            type="number"
            id="sisaDendaTebus"
            min="0"
            placeholder="Isi jika ada sisa denda">
    </div>

    <button
        class="btn-hitung-tebus"
        onclick="hitungTebus()">
        HITUNG TEBUS
    </button>

    <button
        class="btn-reset"
        onclick="resetTebus()">
        RESET
    </button>

    <div
        id="hasilTebus"
        class="hidden">
    </div>

</div>


<!-- =====================================================
     FOLLOW UP
===================================================== -->

<div id="menuFollowUp" class="card hidden">

    <h2 style="color:#249D8F;">
        Follow Up Nasabah
    </h2>

    <div class="field">

        <label>
            Nomor WhatsApp / HP Nasabah
        </label>

        <input
            type="tel"
            id="nomorHP"
            placeholder="081234567890">

    </div>

    <div class="field">

        <label>
            Tanggal Jatuh Tempo
        </label>

        <input
            type="date"
            id="tanggalFollowUp">

    </div>

    <div class="field">

        <label>
            Tanggal Hari Ini
        </label>

        <input
            type="date"
            id="tanggalHariIni">

    </div>

    <div class="field">

        <label>
            Bunga Gadai
        </label>

        <select id="bungaFollowUp">

            <option value="5">
                5%
            </option>

            <option value="10">
                10%
            </option>

        </select>

    </div>

    <button
        class="btn-buat-followup"
        onclick="buatPesanFollowUp()">
        BUAT PESAN
    </button>

    <button
        class="btn-reset"
        onclick="resetFollowUp()">
        RESET
    </button>

    <div
        id="hasilFollowUp"
        class="hidden">
    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div>
        Helisati Putra Hulu, S.Kom
    </div>

    <div class="version">
        Version 1.4
    </div>

    <div class="year">
        2026
    </div>

</footer>

</div>


<script>

/* =====================================================
   VARIABEL
===================================================== */

let teksPerpanjang = "";
let teksTebus = "";

let pesanFollowUp = "";
let pesanLamaFollowUp = "";


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(angka) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(angka);

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function tanggalIndo(tanggal) {

    return new Date(
        tanggal + "T00:00:00"
    ).toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   SELISIH HARI
===================================================== */

function selisihHari(awal, akhir) {

    const a =
        new Date(
            awal + "T00:00:00"
        );

    const b =
        new Date(
            akhir + "T00:00:00"
        );

    return Math.round(
        (
            b.getTime() -
            a.getTime()
        ) / 86400000
    );

}


/* =====================================================
   TAMBAH HARI
===================================================== */

function tambahHari(tanggal, jumlah) {

    const d =
        new Date(
            tanggal + "T00:00:00"
        );

    d.setDate(
        d.getDate() + jumlah
    );

    const tahun =
        d.getFullYear();

    const bulan =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");

    const hari =
        String(
            d.getDate()
        ).padStart(2, "0");

    return `${tahun}-${bulan}-${hari}`;

}


/* =====================================================
   NAVIGASI
===================================================== */

function tampilMenu(menu) {

    const perpanjang =
        document.getElementById(
            "menuPerpanjang"
        );

    const tebus =
        document.getElementById(
            "menuTebus"
        );

    const followup =
        document.getElementById(
            "menuFollowUp"
        );

    const navPerpanjang =
        document.getElementById(
            "navPerpanjang"
        );

    const navTebus =
        document.getElementById(
            "navTebus"
        );

    const navFollowUp =
        document.getElementById(
            "navFollowUp"
        );

    perpanjang.classList.add("hidden");
    tebus.classList.add("hidden");
    followup.classList.add("hidden");

    navPerpanjang.className = "";
    navTebus.className = "";
    navFollowUp.className = "";

    if (menu === "perpanjang") {

        perpanjang.classList.remove("hidden");

        navPerpanjang.className =
            "active-perpanjang";

    }

    else if (menu === "tebus") {

        tebus.classList.remove("hidden");

        navTebus.className =
            "active-tebus";

    }

    else if (menu === "followup") {

        followup.classList.remove("hidden");

        navFollowUp.className =
            "active-followup";

    }

}


/* =====================================================
   PERPANJANG
===================================================== */

function hitungPerpanjang() {

    const nilai =
        Number(
            document.getElementById(
                "nilaiGadai"
            ).value
        );

    const tempo =
        document.getElementById(
            "tanggalJatuhTempo"
        ).value;

    const proses =
        document.getElementById(
            "tanggalProses"
        ).value;

    const persen =
        Number(
            document.getElementById(
                "bunga"
            ).value
        );

    const sisa =
        Number(
            document.getElementById(
                "sisaDenda"
            ).value
        ) || 0;

    if (!nilai || !tempo || !proses) {

        alert(
            "Mohon lengkapi data perpanjang."
        );

        return;

    }

    const periode =
        persen === 5
            ? 15
            : 30;

    const bungaSatu =
        nilai * persen / 100;

    const tempoAkhir =
        tambahHari(
            tempo,
            periode
        );

    let hariLewat =
        selisihHari(
            tempo,
            proses
        );

    if (hariLewat < 0) {
        hariLewat = 0;
    }

    const denda =
        hariLewat * 10000;

    let jumlahBunga = 1;

    const lewatTempoAkhir =
        selisihHari(
            tempoAkhir,
            proses
        );

    if (lewatTempoAkhir > 0) {

        jumlahBunga =
            2 +
            Math.floor(
                (
                    lewatTempoAkhir - 1
                ) / periode
            );

    }

    const totalBunga =
        bungaSatu * jumlahBunga;

    const total =
        totalBunga +
        denda +
        sisa;

    const tempoBaru =
        tambahHari(
            tempoAkhir,
            periode *
            (jumlahBunga - 1)
        );

    let keterangan = "";
    let kelasStatus = "status-aman";

    const sisaHariTempo =
        selisihHari(
            proses,
            tempoAkhir
        );

    if (sisaHariTempo > 3) {

        keterangan =
            `Jatuh tempo berikutnya ${tanggalIndo(tempoAkhir)}.`;

    }

    else if (
        sisaHariTempo >= 0 &&
        sisaHariTempo <= 3
    ) {

        keterangan =
            `⚠️ Sudah memasuki ${sisaHariTempo} hari sebelum jatuh tempo (${tanggalIndo(tempoAkhir)}). Segera lakukan perpanjangan.`;

        kelasStatus =
            "status-warning";

    }

    else {

        keterangan =
            `⚠️ Lewat ${Math.abs(sisaHariTempo)} hari dari tanggal jatuh tempo ${tanggalIndo(tempoAkhir)}.`;

        kelasStatus =
            "status-danger";

    }

    let teksDenda =
        `Denda : ${rupiah(denda)}`;

    if (hariLewat > 0) {

        teksDenda +=
            ` (${hariLewat} hari lewat)`;

    }

    let teksSisa = "";

    if (sisa > 0) {

        teksSisa =
            `\nSisa Denda : ${rupiah(sisa)}`;

    }

    teksPerpanjang =

`*PT. GADAI OGAN BARU*
*OUTLET 07 MARELAN*

BANK BNI
No. Rek : 1978693109
A/N GADAI OGAN BARU

Bunga : ${rupiah(totalBunga)} (${jumlahBunga}x bunga ${persen}%)
${teksDenda}${teksSisa}
*Total  : ${rupiah(total)}*

Kalau sudah di transfer jangan lupa dikirim bukti pembayarannya dan nama akun pengirimnya yah Pak/Bu
terimakasih 🙏😇`;

    const hasil =
        document.getElementById(
            "hasilPerpanjang"
        );

    hasil.className =
        "hasil";

    hasil.innerHTML = `

        <div class="baris">
            <span>Nilai Gadai</span>
            <strong>${rupiah(nilai)}</strong>
        </div>

        <div class="baris">
            <span>Jatuh Tempo Awal</span>
            <strong>${tanggalIndo(tempo)}</strong>
        </div>

        <div class="baris">
            <span>Tanggal Perpanjang</span>
            <strong>${tanggalIndo(proses)}</strong>
        </div>

        <div class="baris">
            <span>Bunga</span>
            <strong>${jumlahBunga}x ${persen}%</strong>
        </div>

        <div class="baris">
            <span>Jatuh Tempo Berikutnya</span>
            <strong>${tanggalIndo(tempoBaru)}</strong>
        </div>

        <div class="baris">
            <span>Total Bunga</span>
            <strong>${rupiah(totalBunga)}</strong>
        </div>

        <div class="baris">
            <span>Denda</span>
            <strong>${rupiah(denda)}</strong>
        </div>

        <div class="baris">
            <span>Sisa Denda</span>
            <strong>${rupiah(sisa)}</strong>
        </div>

        <div class="baris total">
            <span>TOTAL BAYAR</span>
            <strong>${rupiah(total)}</strong>
        </div>

        <div class="status ${kelasStatus}">
            ${keterangan}
        </div>

        <button
            class="btn-salin"
            onclick="salinPerpanjang()">
            📋 SALIN RINCIAN PEMBAYARAN
        </button>

    `;

}


/* =====================================================
   TEBUS
===================================================== */

function hitungTebus() {

    const pokok =
        Number(
            document.getElementById(
                "nilaiTebus"
            ).value
        );

    const tempo =
        document.getElementById(
            "tempoTebus"
        ).value;

    const tanggalTebus =
        document.getElementById(
            "tanggalTebus"
        ).value;

    const persen =
        Number(
            document.getElementById(
                "bungaTebus"
            ).value
        );

    const sisaDenda =
        Number(
            document.getElementById(
                "sisaDendaTebus"
            ).value
        ) || 0;

    if (!pokok || !tempo || !tanggalTebus) {

        alert(
            "Mohon lengkapi data tebus."
        );

        return;

    }

    let hariLewat =
        selisihHari(
            tempo,
            tanggalTebus
        );

    if (hariLewat < 0) {
        hariLewat = 0;
    }

    const denda =
        hariLewat * 10000;

    let jumlahBunga = 0;

    if (persen === 5) {

        if (hariLewat <= 10) {
            jumlahBunga = 0;
        }

        else if (hariLewat <= 15) {
            jumlahBunga = 1;
        }

        else if (hariLewat <= 30) {
            jumlahBunga = 2;
        }

        else {

            jumlahBunga =
                3 +
                Math.floor(
                    (
                        hariLewat - 31
                    ) / 15
                );

        }

    }

    else {

        if (hariLewat <= 15) {
            jumlahBunga = 0;
        }

        else {

            jumlahBunga =
                1 +
                Math.floor(
                    (
                        hariLewat - 16
                    ) / 15
                );

        }

    }

    const bungaSatu =
        pokok *
        persen /
        100;

    const bungaKeterlambatan =
        bungaSatu *
        jumlahBunga;

    const total =
        pokok +
        bungaKeterlambatan +
        denda +
        sisaDenda;

    let keterangan;

    if (hariLewat === 0) {

        keterangan =
            "Ditebus sebelum atau tepat pada tanggal jatuh tempo.";

    }

    else {

/* =====================================================
   TELEPON NASABAH
===================================================== */

function teleponNasabah() {

    const nomorHP =
        document.getElementById(
            "nomorHP"
        ).value.trim();

    if (!nomorHP) {

        alert(
            "Silakan masukkan nomor HP nasabah."
        );

        return;

    }

    let nomor =
        nomorHP.replace(
            /\D/g,
            ""
        );

    if (nomor.startsWith("0")) {

        nomor =
            "62" +
            nomor.substring(1);

    }

    if (
        nomor.length < 10 ||
        nomor.length > 15
    ) {

        alert(
            "Nomor HP tidak valid."
        );

        return;

    }

    window.location.href =
        "tel:+" + nomor;

}

function kirimWhatsAppFollowUp() {

    if (!nomorHP) {

    let nomor =
        nomorHP.replace(
            /\D/g,
            ""
        );

    if (nomor.startsWith("0")) {

            nomor.substring(1);

    }

    if (
        nomor.length < 10 ||
        nomor.length > 15
    ) {

        alert(
            "Nomor HP tidak valid."

    }

    const url =
        "https://wa.me/" +

        encodeURIComponent(

    window.open(
        url,
        "_blank"

/* =====================================================
   FUNGSI SALIN
===================================================== */

function salinTeks(
    teks,
    pesanBerhasil
) {

    if (navigator.clipboard) {

        navigator.clipboard
            .writeText(teks)

            .then(function() {

                alert(
                    pesanBerhasil
                );

            })

            .catch(function() {

                fallbackCopy(
                    teks,
                    pesanBerhasil
                );

            });

    }

    else {

        fallbackCopy(
            teks,
            pesanBerhasil
        );

    }

}


function fallbackCopy(
    teks,
    pesanBerhasil
) {

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value =
        teks;

    document.body.appendChild(
        textarea
    );

    textarea.select();

    document.execCommand(
        "copy"
    );

    document.body.removeChild(
        textarea
    );

    alert(
        pesanBerhasil
    );

}

/* =====================================================
   TANGGAL HARI INI
===================================================== */

function setTanggalHariIni(id) {

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const hari =
        String(
            sekarang.getDate()
        ).padStart(
            2,
            "0"
        );

    document.getElementById(id).value =
        `${tahun}-${bulan}-${hari}`;

}
